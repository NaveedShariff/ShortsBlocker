name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ShortsBlocker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShortsBlocker-apk
          path: ShortsBlocker.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shorts Blocker v2.0 (build ${{ github.run_number }})
          body: |
            **New in v2.0:** blocks Instagram Reels as well as YouTube Shorts. Choose which in the app.

            Download **ShortsBlocker.apk** below and open it on your Android phone.

            📖 Step-by-step setup (with pictures): https://github.com/NaveedShariff/ShortsBlocker#readme

            If you see "App blocked to protect your device", switch off Play Protect for a moment while you install. See Step 1 in the guide.
          files: ShortsBlocker.apk
