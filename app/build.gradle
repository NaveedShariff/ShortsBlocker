plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shariff.shortsblocker'
    compileSdk 35

    defaultConfig {
        applicationId "com.shariff.shortsblocker"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // Fixed key so every new build installs over the old one (no uninstall needed).
    signingConfigs {
        fixed {
            storeFile file('shortsblocker.keystore')
            storePassword 'shortsblocker'
            keyAlias 'shortsblocker'
            keyPassword 'shortsblocker'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
