<svg xmlns='http://www.w3.org/2000/svg' viewBox='-10 -6 1050 486' width='1050' height='486'><rect x='-10' y='-6' width='1050' height='486' fill='#ffffff'/><defs><clipPath id='scr'><rect x='0' y='0' width='220' height='420' rx='26'/></clipPath></defs><g transform='translate(0,0)'><text x='110.0' y='26' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='bold' fill='#1C1B1A' text-anchor='middle'>1. Turn on</text><g transform='translate(0,44)'><rect x='0' y='0' width='220' height='420' rx='26' fill='#fff' stroke='#1C1B1A' stroke-width='3'/><rect x='80.0' y='8' width='60' height='8' rx='4' fill='#1C1B1A'/><g clip-path='url(#scr)'><text x='18' y='60' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='18' font-weight='bold' fill='#1C1B1A' text-anchor='start'>Shorts Blocker</text><text x='18' y='80' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' fill='#6B6863' text-anchor='start'>Keep YouTube. Lose the Shorts.</text><rect x='12' y='96' width='196' height='150' rx='14' fill='#FDECEC'/><text x='24' y='122' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='bold' fill='#1C1B1A' text-anchor='start'>One-time setup</text><text x='24' y='142' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' fill='#6B6863' text-anchor='start'>Turn on the blocker below</text><rect x='24' y='190' width='172' height='36' rx='24' fill='#D93636'/><text x='110.0' y='213' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='bold' fill='#fff' text-anchor='middle'>Turn on Shorts Blocker</text><rect x='20' y='186' width='180' height='44' rx='18' fill='none' stroke='#D93636' stroke-width='3'/></g></g></g><path d='M228 254.0 h30' stroke='#6B6863' stroke-width='3'/><path d='M258 247.0 l10 7 l-10 7 z' fill='#6B6863'/><g transform='translate(270,0)'><text x='110.0' y='26' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='bold' fill='#1C1B1A' text-anchor='middle'>2. I agree</text><g transform='translate(0,44)'><rect x='0' y='0' width='220' height='420' rx='26' fill='#fff' stroke='#1C1B1A' stroke-width='3'/><rect x='80.0' y='8' width='60' height='8' rx='4' fill='#1C1B1A'/><g clip-path='url(#scr)'><rect x='10' y='110' width='200' height='220' rx='16' fill='#F6F5F2'/><text x='26' y='140' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='bold' fill='#1C1B1A' text-anchor='start'>Before you turn it on</text><text x='26' y='166' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' fill='#6B6863' text-anchor='start'>Reads the YouTube app's</text><text x='26' y='184' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' fill='#6B6863' text-anchor='start'>screen layout only. Nothing</text><text x='26' y='202' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' fill='#6B6863' text-anchor='start'>leaves your phone.</text><text x='190' y='310' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='bold' fill='#D93636' text-anchor='end'>I agree</text><rect x='128' y='290' width='70' height='30' rx='8' fill='none' stroke='#D93636' stroke-width='3'/></g></g></g><path d='M498 254.0 h30' stroke='#6B6863' stroke-width='3'/><path d='M528 247.0 l10 7 l-10 7 z' fill='#6B6863'/><g transform='translate(540,0)'><text x='110.0' y='26' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='bold' fill='#1C1B1A' text-anchor='middle'>3. Find Shorts Blocker</text><g transform='translate(0,44)'><rect x='0' y='0' width='220' height='420' rx='26' fill='#fff' stroke='#1C1B1A' stroke-width='3'/><rect x='80.0' y='8' width='60' height='8' rx='4' fill='#1C1B1A'/><g clip-path='url(#scr)'><rect x='0' y='22' width='220' height='44' fill='#F6F5F2'/><text x='16' y='50' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='22' font-weight='normal' fill='#1C1B1A' text-anchor='start'>‹</text><text x='40' y='50' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='bold' fill='#1C1B1A' text-anchor='start'>Accessibility</text><text x='18' y='92' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='11' font-weight='bold' fill='#6B6863' text-anchor='start'>Downloaded / Installed apps</text><line x1='14' y1='142' x2='206' y2='142' stroke='#E6E3DE'/><text x='18' y='120' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' fill='#1C1B1A' text-anchor='start'>Shorts Blocker</text><text x='18' y='136' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' fill='#6B6863' text-anchor='start'>Off</text><rect x='8' y='96' width='204' height='48' rx='8' fill='none' stroke='#D93636' stroke-width='3'/><line x1='14' y1='192' x2='206' y2='192' stroke='#E6E3DE'/><text x='18' y='170' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' fill='#1C1B1A' text-anchor='start'>Other app</text><text x='18' y='186' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' fill='#6B6863' text-anchor='start'>Off</text></g></g></g><path d='M768 254.0 h30' stroke='#6B6863' stroke-width='3'/><path d='M798 247.0 l10 7 l-10 7 z' fill='#6B6863'/><g transform='translate(810,0)'><text x='110.0' y='26' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='14' font-weight='bold' fill='#1C1B1A' text-anchor='middle'>4. ON → Allow</text><g transform='translate(0,44)'><rect x='0' y='0' width='220' height='420' rx='26' fill='#fff' stroke='#1C1B1A' stroke-width='3'/><rect x='80.0' y='8' width='60' height='8' rx='4' fill='#1C1B1A'/><g clip-path='url(#scr)'><rect x='0' y='22' width='220' height='44' fill='#F6F5F2'/><text x='16' y='50' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='22' font-weight='normal' fill='#1C1B1A' text-anchor='start'>‹</text><text x='40' y='50' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='15' font-weight='bold' fill='#1C1B1A' text-anchor='start'>Shorts Blocker</text><line x1='14' y1='126' x2='206' y2='126' stroke='#E6E3DE'/><text x='18' y='104' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' fill='#1C1B1A' text-anchor='start'>Use Shorts Blocker</text><rect x='158' y='92' width='42' height='24' rx='12' fill='#2E7D32'/><circle cx='188' cy='104' r='9' fill='#fff'/><rect x='150' y='84' width='58' height='40' rx='14' fill='none' stroke='#D93636' stroke-width='3'/><rect x='10' y='200' width='200' height='120' rx='16' fill='#F6F5F2'/><text x='26' y='230' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='bold' fill='#1C1B1A' text-anchor='start'>Allow Shorts Blocker to</text><text x='26' y='248' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='12' font-weight='bold' fill='#1C1B1A' text-anchor='start'>have full control?</text><text x='190' y='300' font-family='-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif' font-size='13' font-weight='bold' fill='#D93636' text-anchor='end'>Allow</text><rect x='138' y='280' width='60' height='30' rx='8' fill='none' stroke='#D93636' stroke-width='3'/></g></g></g></svg>